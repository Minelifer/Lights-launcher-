plugins {
    id 'com.android.application'
}

// Подпись релиза:
// 1. Если заданы секреты (в CI их кладёт workflow), используется ваш личный ключ.
// 2. Иначе общий ключ из репозитория app/ci-debug.keystore. Он одинаковый для всех сборок,
//    поэтому новая версия ставится поверх старой без удаления. Ключ публичный и не секретный,
//    для личного лаунчера этого достаточно; для публикации задайте свой ключ через секреты.
def releaseKeystorePath = System.getenv("KEYSTORE_PATH")
def hasReleaseKey = releaseKeystorePath != null && file(releaseKeystorePath).exists()

// Номер сборки в CI растёт с каждым запуском, так Android видит новую сборку как обновление
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.example.lightlauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.lightlauncher"
        minSdk 21
        targetSdk 34
        versionCode buildNumber
        versionName "1.2"
    }

    signingConfigs {
        ciDebug {
            storeFile file("ci-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            if (hasReleaseKey) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.ciDebug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
