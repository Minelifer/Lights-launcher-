plugins {
    id 'com.android.application'
}

// Подпись релиза берётся из переменных окружения (в CI они приходят из GitHub Secrets).
// Если ключа нет (локальная сборка), используется debug-подпись.
def releaseKeystorePath = System.getenv("KEYSTORE_PATH")
def hasReleaseKey = releaseKeystorePath != null && file(releaseKeystorePath).exists()

android {
    namespace 'com.example.lightlauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.lightlauncher"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
